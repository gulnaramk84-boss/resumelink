---
layout: default
---
<style>
.ru-h1{font-size:clamp(1.7rem,5vw,2.5rem);font-weight:500;letter-spacing:-.02em;line-height:1.25;color:var(--forest);margin-bottom:12px}
.ru-intro{font-size:16px;color:var(--muted);line-height:1.8;margin-bottom:24px}
.r-body{font-size:15px;line-height:1.8;color:var(--forest)}
.r-body h2{font-size:19px;margin:32px 0 10px}
.r-body p{margin-bottom:12px}
.r-body ul,.r-body ol{margin:0 0 14px 20px}
.r-body li{margin-bottom:6px}
.r-body pre{white-space:pre-wrap;background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:16px;font:14px/1.7 'DM Sans',sans-serif;margin-bottom:6px}
.r-body a{color:var(--green-dk)}
.ru-cta{display:flex;flex-wrap:wrap;gap:12px;margin:32px 0}
.ru-cta a{background:var(--green-dk);color:#fff;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:500;text-decoration:none}
.ru-cta a+a{background:var(--mint);color:var(--green-dk);border:0.5px solid var(--border)}
</style>
<p style="font-size:13px;margin-bottom:14px"><a href="/guides-ru/" style="color:var(--green-dk)">← Все гайды на русском</a></p>
<h1 class="ru-h1">{{ page.h1 }}</h1>
<p class="ru-intro">{{ page.description }}</p>
<details class="r-toc" id="r-toc" open hidden><summary>Содержание</summary><ul></ul></details>
<div class="r-body">{{ content }}</div>
<div class="ru-cta"><a href="/">Создать профиль из резюме</a><a href="/match-check.html">Сравнить резюме с вакансией</a></div>
{% include guide-tools.html %}
