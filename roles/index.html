<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Career Guides — Find Your Role | ResumeLink</title>
    <meta name="description" content="Browse 200+ AI career guides: from AI Engineers to AI Ethicists. Find the perfect role, learn required skills, salary ranges, and career paths.">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="https://resumelink.cc/roles/">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">

    <style>
        :root {
            --green: #1DB368;
            --green-dk: #0D8A4E;
            --forest: #0D3D28;
            --bg: #F2FAF6;
            --surface: #FFFFFF;
            --mint: #EAF7F0;
            --border: #C5E8D5;
            --text: #0D3D28;
            --muted: #3F6F57;
            --faint: #A8CDB9;
        }
        [data-theme="dark"] {
            --green: #2EE383;
            --green-dk: #1FC46D;
            --forest: #E8F5F0;
            --bg: #0D3D28;
            --surface: #1A5F42;
            --mint: #0F6B47;
            --border: #2E8A5F;
            --text: #E8F5F0;
            --muted: #A8D5BA;
            --faint: #5A8A70;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text); min-height: 100vh; }

        nav { position: sticky; top: 0; z-index: 100; background: rgba(242,250,246,0.92); backdrop-filter: blur(12px); border-bottom: 0.5px solid var(--border); padding: 0 clamp(1.5rem,5vw,4rem); height: 62px; display: flex; align-items: center; justify-content: space-between; }
        .nav-logo { font-size: 20px; font-weight: 500; color: var(--forest); text-decoration: none; }
        .nav-logo span { color: var(--green); }
        .nav-theme { background: none; border: none; font-size: 18px; cursor: pointer; padding: 8px; }
        .nav-actions { display: flex; align-items: center; gap: 8px; }
        .lang-toggle { background: none; border: 0.5px solid var(--border); color: var(--muted); font: 600 12px 'DM Sans', sans-serif; letter-spacing: .06em; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
        .lang-toggle:hover, .lang-toggle:focus-visible { color: var(--forest); border-color: var(--green); outline: none; }
        a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
        .lang-note { font-size: 12px; color: var(--muted); margin: -1rem 0 1.5rem; }

        .container { max-width: 1200px; margin: 0 auto; padding: clamp(2rem,4vw,4rem) clamp(1.5rem,5vw,4rem); }

        h1 { font-size: clamp(2rem,3.5vw,2.8rem); font-weight: 300; margin-bottom: 1rem; color: var(--forest); }
        .subtitle { font-size: 15px; color: var(--muted); margin-bottom: 2rem; }

        .search-box { display: flex; gap: 12px; margin-bottom: 2rem; flex-wrap: wrap; }
        input[type="text"] { flex: 1; min-width: 250px; padding: 12px 16px; border: 0.5px solid var(--border); border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 14px; background: var(--surface); color: var(--text); }
        input[type="text"]:focus { outline: none; border-color: var(--green); }

        .filter-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 2rem; }
        .filter-tag { background: var(--surface); color: var(--text); font-family: inherit; border: 0.5px solid var(--border); padding: 8px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; transition: all .2s; }
        .filter-tag:hover { border-color: var(--green); }
        .filter-tag.active { background: var(--mint); border-color: var(--green); color: var(--green-dk); font-weight: 500; }

        .roles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .role-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 14px; padding: 20px; transition: all .2s; text-decoration: none; color: inherit; display: flex; flex-direction: column; }
        .role-card:hover { border-color: var(--green); transform: translateY(-2px); box-shadow: 0 4px 20px rgba(29,179,104,0.1); }

        .role-category { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--green-dk); margin-bottom: 8px; }
        .role-title { font-size: 15px; font-weight: 500; color: var(--forest); margin-bottom: 8px; }
        .role-desc { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 12px; flex: 1; }

        .role-meta { display: flex; justify-content: space-between; font-size: 12px; font-weight: 500; color: var(--green-dk); padding-top: 12px; border-top: 0.5px solid var(--border); }
        .role-salary { color: var(--green); font-weight: 500; }

        .no-results { text-align: center; padding: 3rem; color: var(--muted); }
        .no-results-icon { font-size: 48px; margin-bottom: 1rem; }

        footer { border-top: 0.5px solid var(--border); padding: 2rem clamp(1.5rem,5vw,4rem); text-align: center; font-size: 12px; color: var(--muted); }

        @media (max-width: 640px) {
            .roles-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<nav>
    <a href="/" class="nav-logo">Resume<span>Link</span></a>
    <div class="nav-actions"><button type="button" class="lang-toggle" id="lang-toggle" onclick="toggleLang()" aria-label="Language"></button><button class="nav-theme" id="theme-toggle" onclick="toggleTheme()" aria-label="Theme">🌙</button></div>
</nav>

<div class="container">
    <h1 id="t-title">Explore 200+ AI Career Guides</h1>
    <p class="subtitle" id="t-sub">Find your next role, learn required skills, salary insights, and career paths</p>

    <div class="search-box">
        <input type="text" aria-label="Search" id="search-input" placeholder="Search roles... (Engineer, Manager, Designer, etc.)" onkeyup="filterRoles()">
    </div>

    <div class="filter-tags" id="categories"></div>

    <div class="roles-grid" id="rolesContainer"></div>
    <div class="no-results" id="noResults" style="display:none;">
        <div class="no-results-icon">🔍</div>
        <p id="t-none">No roles found. Try adjusting your search.</p>
    </div>
</div>

<footer>
    <p id="t-foot">&copy; 2026 ResumeLink. All career guides are AI-powered and regularly updated.</p>
</footer>

<script>
const rolesData = [
{% for r in site.roles %}{% assign d = r.description | default: r.summary_hack | default: r.h1 %}    { url: {{ r.url | jsonify }}, title: {{ r.title | jsonify }}, category: {{ r.category | default: "Other" | jsonify }}, desc: {{ d | strip_html | truncate: 150 | jsonify }} },
{% endfor %}
];

// ---- Language (same rule as the home page: saved choice, else browser language)
function rlLang() { try { var s = localStorage.getItem('rl_lang'); if (s === 'en' || s === 'ru') return s; } catch (e) {} return navigator.language.startsWith('en') ? 'en' : 'ru'; }
function toggleLang() { try { localStorage.setItem('rl_lang', rlLang() === 'en' ? 'ru' : 'en'); } catch (e) {} location.reload(); }
const LANG = rlLang();
const I18N = {
    en: { title: 'Explore 200+ AI Career Guides', sub: 'Find your next role, learn required skills, salary insights, and career paths', search: 'Search roles... (Engineer, Manager, Designer, etc.)', none: 'No roles found. Try adjusting your search.', read: 'Read guide →', foot: '© 2026 ResumeLink. All career guides are AI-powered and regularly updated.', note: '' },
    ru: { title: 'Более 200 карьерных гайдов по ИИ', sub: 'Найдите свою роль: нужные навыки, зарплаты и пути в профессию', search: 'Поиск ролей… (инженер, менеджер, дизайнер)', none: 'Ничего не найдено. Попробуйте изменить запрос.', read: 'Читать гайд →', foot: '© 2026 ResumeLink. Все гайды создаются с помощью ИИ и регулярно обновляются.', note: 'Интерфейс переведён, сами тексты гайдов пока на английском.' }
};
const L = I18N[LANG];
const CAT_RU = { 'AI Roles': 'Роли в ИИ', 'Guides & Strategy': 'Гайды и стратегия', 'Ethics & Society': 'Этика и общество', 'Skills & Frameworks': 'Навыки и методики', 'Security & Privacy': 'Безопасность и приватность', 'Checklists': 'Чек-листы', 'Other': 'Другое' };
function catLabel(c) { return LANG === 'ru' ? (CAT_RU[c] || c) : c; }
(function applyLang() {
    document.documentElement.lang = LANG;
    var set = function (id, txt) { var e = document.getElementById(id); if (e) e.textContent = txt; };
    set('t-title', L.title); set('t-sub', L.sub); set('t-none', L.none); set('t-foot', L.foot);
    set('lang-toggle', LANG === 'en' ? 'RU' : 'EN');
    var s = document.getElementById('search-input'); if (s) s.placeholder = L.search;
    if (L.note) { var sub = document.getElementById('t-sub'); var n = document.createElement('p'); n.className = 'lang-note'; n.textContent = L.note; sub.after(n); }
})();
// Extract unique categories
const categories = [...new Set(rolesData.map(r => r.category))];
const searchInput = document.getElementById('search-input');
let selectedCategory = null;

// Build category filters
const categoriesContainer = document.getElementById('categories');
categories.forEach(cat => {
    const tag = document.createElement('button');
    tag.className = 'filter-tag';
    tag.textContent = catLabel(cat);
    tag.onclick = () => {
        selectedCategory = selectedCategory === cat ? null : cat;
        tag.classList.toggle('active');
        filterRoles();
        // Toggle other tags
        Array.from(categoriesContainer.querySelectorAll('.filter-tag')).forEach(t => {
            if (t !== tag) t.classList.remove('active');
        });
    };
    categoriesContainer.appendChild(tag);
});

function filterRoles() {
    const search = searchInput.value.toLowerCase();
    const filtered = rolesData.filter(role => {
        const matchesSearch = role.title.toLowerCase().includes(search) || role.desc.toLowerCase().includes(search);
        const matchesCategory = !selectedCategory || role.category === selectedCategory;
        return matchesSearch && matchesCategory;
    });

    const container = document.getElementById('rolesContainer');
    const noResults = document.getElementById('noResults');

    if (filtered.length === 0) {
        container.innerHTML = '';
        noResults.style.display = 'block';
    } else {
        noResults.style.display = 'none';
        container.innerHTML = filtered.map(role => `
            <a href="${role.url}" class="role-card">
                <div class="role-category">${catLabel(role.category)}</div>
                <h3 class="role-title">${role.title}</h3>
                <p class="role-desc">${role.desc}</p>
                <div class="role-meta">
                    <span>${L.read}</span>
                </div>
            </a>
        `).join('');
    }
}

function toggleTheme() {
    const html = document.documentElement;
    const theme = html.getAttribute('data-theme');
    const newTheme = theme === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
}

// Load theme on page load
window.addEventListener('load', () => {
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
});

// Initial render
filterRoles();
</script>

</body>
</html>
